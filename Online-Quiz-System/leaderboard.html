<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Leaderboard - QuizPro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .podium-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            width: 140px;
            backdrop-filter: var(--glass-blur);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .podium-1 { height: 210px; border-color: #d4af37; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }
        .podium-2 { height: 180px; border-color: #c0c0c0; }
        .podium-3 { height: 160px; border-color: #cd7f32; }

        .podium-crown { font-size: 2.2rem; margin-bottom: 0.2rem; }
        .podium-score { font-weight: bold; color: var(--primary-color); margin-top: 0.3rem; }
    </style>
</head>

<body>
    <div class="global-loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header Navigation -->
    <header class="animate-fade-in container">
        <a href="index.html" class="logo">🎓 QuizPro</a>
        <nav style="display: flex; gap: 0.75rem; align-items: center;">
            <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
            <a href="leaderboard.html" class="btn btn-primary">Leaderboard</a>
            <button type="button" class="theme-toggle nav-icon-btn" onclick="StorageHelper.toggleTheme()" title="Toggle Theme">🌓</button>
            <div class="user-auth-widget"></div>
        </nav>
        <button type="button" class="quizpro-mobile-toggle" id="quizproMobileToggle" aria-label="Open Mobile Menu">☰</button>
    </header>

    <!-- Mobile Navigation Drawer -->
    <div class="quizpro-drawer-overlay" id="quizproDrawerOverlay"></div>
    <aside class="quizpro-mobile-drawer" id="quizproMobileDrawer">
        <div>
            <div class="quizpro-drawer-header">
                <a href="index.html" class="logo">🎓 QuizPro</a>
                <button type="button" class="quizpro-drawer-close" id="quizproDrawerClose">&times;</button>
            </div>
            <div class="quizpro-drawer-nav">
                <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
                <a href="leaderboard.html" class="btn btn-primary">Leaderboard</a>
                <a href="admin-dashboard.html" class="btn btn-secondary">Admin Panel</a>
                <a href="index.html" class="btn btn-secondary">Home</a>
            </div>
        </div>
    </aside>

    <main class="container" style="max-width: 900px;">
        <div class="card animate-fade-in text-center" style="margin-bottom: 2rem;">
            <h2>🏆 Student Honor Leaderboard</h2>
            <p style="color: var(--text-secondary);">Top performing students across departments based on score accuracy and speed.</p>

            <!-- Department Filter Pills -->
            <div class="dept-pill-group" style="margin-top: 1.5rem; justify-content: center;">
                <button class="dept-pill active" onclick="filterLeaderboard('All', this)">All Departments</button>
                <button class="dept-pill" onclick="filterLeaderboard('BCA', this)">BCA</button>
                <button class="dept-pill" onclick="filterLeaderboard('BSc', this)">BSc</button>
                <button class="dept-pill" onclick="filterLeaderboard('BCom CA', this)">BCom CA</button>
                <button class="dept-pill" onclick="filterLeaderboard('BBA', this)">BBA</button>
                <button class="dept-pill" onclick="filterLeaderboard('BCom', this)">BCom</button>
            </div>

            <!-- Search Student Input -->
            <div style="max-width: 400px; margin: 1rem auto 0 auto;">
                <input type="text" id="leaderSearchInput" class="form-control" placeholder="🔍 Search student name..." onkeyup="searchLeaderboard()" />
            </div>
        </div>

        <!-- TOP 3 PODIUM SHOWCASE -->
        <div class="podium-container animate-fade-in" id="podiumShowcase">
            <!-- Dynamically populated -->
        </div>

        <!-- FULL LEADERBOARD TABLE -->
        <div class="card animate-fade-in">
            <div id="leaderboardList">
                <!-- Ranked rows -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 QuizPro - BCA Final Year Examination System</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/leaderboard.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - QuizPro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body><div class="global-loader" id="loader"><div class="spinner"></div></div>
    <header class="animate-fade-in container">
        <a href="index.html" class="logo" style="color: var(--danger-color)">🛡️ QuizPro Admin</a>
        <nav>
            <a href="index.html" class="btn btn-secondary">Student Portal</a>
            <button id="theme-btn" class="theme-toggle" aria-label="Toggle Dark Theme">🌙</button>
        </nav>
    </header>

    <main class="container animate-fade-in">
        <div class="card" style="max-width: 400px; margin: 4rem auto;">
            <h2 style="text-align: center; margin-bottom: 2rem;">Admin Access</h2>
            
            <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.1); color: var(--danger-color); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; border: 1px solid var(--danger-color);">
                Invalid username or password.
            </div>

            <form id="admin-login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter admin username" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter admin password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="background-color: var(--danger-color);">Secure Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.8rem; color: var(--text-secondary);">Demo Credentials: admin / password123</p>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            StorageHelper.applyTheme();
            const themeBtn = document.getElementById('theme-btn');
            themeBtn.textContent = StorageHelper.getSettings().theme === 'dark' ? '☀️' : '🌙';
            themeBtn.addEventListener('click', () => {
                themeBtn.textContent = StorageHelper.toggleTheme() === 'dark' ? '☀️' : '🌙';
            });

            // Redirect if already logged in
            if (AdminAuth.isLoggedIn()) {
                window.location.href = 'admin-dashboard.html';
            }

            document.getElementById('admin-login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;
                
                if (AdminAuth.login(user, pass)) {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            });
        });
    </script>
<script>window.addEventListener('load', () => { setTimeout(() => document.getElementById('loader')?.classList.add('loader-hidden'), 300); });</script>
</body>
</html>

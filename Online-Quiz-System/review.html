<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Review - QuizPro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/result.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div class="global-loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header Navigation -->
    <header class="animate-fade-in container">
        <a href="index.html" class="logo">🎓 QuizPro</a>
        <nav style="display: flex; gap: 0.75rem; align-items: center;">
            <a href="result.html" class="btn btn-secondary">← Back to Result</a>
            <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
            <button type="button" class="theme-toggle nav-icon-btn" onclick="StorageHelper.toggleTheme()" title="Toggle Theme">🌓</button>
        </nav>
    </header>

    <main class="container" style="max-width: 850px;">
        <div class="card animate-fade-in text-center" style="margin-bottom: 2rem;">
            <h2>🔍 Detailed Question & Answer Review</h2>
            <p style="color: var(--text-secondary);">Analyze your responses with explanations for each question.</p>

            <!-- Filter Pills -->
            <div class="dept-pill-group" style="margin-top: 1rem; justify-content: center;">
                <button class="dept-pill active" onclick="filterReview('all', this)">All Questions</button>
                <button class="dept-pill" onclick="filterReview('correct', this)">🟢 Correct Only</button>
                <button class="dept-pill" onclick="filterReview('wrong', this)">🔴 Incorrect Only</button>
            </div>
        </div>

        <!-- Review Items List Container -->
        <div id="reviewContainer">
            <!-- Populated via JS -->
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 QuizPro - BCA Final Year Examination System</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentFilter = 'all';
        let reviewData = [];

        document.addEventListener('DOMContentLoaded', () => {
            let result = null;
            try { result = JSON.parse(localStorage.getItem('latestQuizResult')); } catch(e) {}
            
            reviewData = (result && result.reviewData) ? result.reviewData : [];
            renderReviewItems();
        });

        function filterReview(filter, el) {
            currentFilter = filter;
            const pills = el.parentElement.querySelectorAll('.dept-pill');
            pills.forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            renderReviewItems();
        }

        function renderReviewItems() {
            const container = document.getElementById('reviewContainer');
            if (!container) return;

            let filtered = reviewData;
            if (currentFilter === 'correct') filtered = reviewData.filter(r => r.isCorrect);
            else if (currentFilter === 'wrong') filtered = reviewData.filter(r => !r.isCorrect);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="card text-center"><p style="color: var(--text-secondary);">No questions matching this filter.</p></div>`;
                return;
            }

            container.innerHTML = filtered.map((item, idx) => {
                let userAnsText = 'Skipped / Unanswered';
                if (item.type === 'fill_blank') {
                    userAnsText = item.userAnswer !== undefined ? item.userAnswer : 'None';
                } else if (item.options && item.userAnswer !== undefined && item.userAnswer !== null) {
                    userAnsText = item.options[item.userAnswer] || 'Option ' + (item.userAnswer + 1);
                }

                let correctAnsText = item.answerText;
                if (!correctAnsText && item.type === 'fill_blank') {
                    correctAnsText = item.correctAnswer;
                } else if (!correctAnsText && item.options) {
                    correctAnsText = item.options[item.correctAnswer] || item.correctAnswer;
                }

                return `
                    <div class="review-item ${item.isCorrect ? 'correct' : 'wrong'} animate-fade-in">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <span class="badge ${item.isCorrect ? 'badge-student' : 'badge-admin'}">${item.isCorrect ? '✓ Correct' : '✗ Incorrect'}</span>
                            <small style="color: var(--text-secondary)">Question ${idx + 1}</small>
                        </div>
                        <div class="review-question">${StorageHelper.escapeHTML(item.question)}</div>
                        
                        ${item.code ? `<div class="code-block-view"><pre><code>${StorageHelper.escapeHTML(item.code)}</code></pre></div>` : ''}

                        <div class="review-answer" style="margin-top: 0.5rem;">
                            <strong>Your Answer:</strong> <span style="color: ${item.isCorrect ? 'var(--success-color)' : 'var(--danger-color)'}">${StorageHelper.escapeHTML(userAnsText)}</span>
                        </div>
                        <div class="review-answer">
                            <strong>Correct Answer:</strong> <span style="color: var(--success-color)">${StorageHelper.escapeHTML(correctAnsText)}</span>
                        </div>
                        <div class="review-explanation">
                            💡 <strong>Explanation:</strong> ${StorageHelper.escapeHTML(item.explanation || 'Standard evaluation answer.')}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>

</html>

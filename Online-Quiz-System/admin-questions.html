<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Questions - QuizPro Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div class="global-loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header Navigation -->
    <header class="animate-fade-in container">
        <a href="index.html" class="logo">🎓 QuizPro Admin</a>
        <nav style="display: flex; gap: 0.75rem; align-items: center;">
            <a href="admin-dashboard.html" class="btn btn-secondary">Admin Stats</a>
            <a href="admin-questions.html" class="btn btn-primary">Manage Questions</a>
            <a href="dashboard.html" class="btn btn-secondary">Student Dashboard</a>
            <button type="button" class="theme-toggle nav-icon-btn" onclick="StorageHelper.toggleTheme()" title="Toggle Theme">🌓</button>
            <div class="user-auth-widget"></div>
        </nav>
        <button type="button" class="quizpro-mobile-toggle" id="quizproMobileToggle" aria-label="Open Navigation Menu">☰</button>
    </header>

    <!-- Mobile Navigation Drawer -->
    <div class="quizpro-drawer-overlay" id="quizproDrawerOverlay"></div>
    <aside class="quizpro-mobile-drawer" id="quizproMobileDrawer">
        <div>
            <div class="quizpro-drawer-header">
                <a href="index.html" class="logo">🎓 QuizPro Admin</a>
                <button type="button" class="quizpro-drawer-close" id="quizproDrawerClose">&times;</button>
            </div>
            <div class="quizpro-drawer-nav">
                <a href="admin-dashboard.html" class="btn btn-secondary">Admin Stats</a>
                <a href="admin-questions.html" class="btn btn-primary">Manage Questions</a>
                <a href="dashboard.html" class="btn btn-secondary">Student Dashboard</a>
                <a href="index.html" class="btn btn-secondary">Home</a>
            </div>
        </div>
    </aside>

    <main class="container">
        <div class="card animate-fade-in" style="margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h2>📝 Question Bank Management</h2>
                    <p style="color: var(--text-secondary); margin: 0;">Add, edit, or delete assessment questions across all subjects & question types.</p>
                </div>
                <button class="btn btn-primary" onclick="openQuestionModal()">+ Add New Question</button>
            </div>

            <!-- Subject & Search Bar Filters -->
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
                <select id="adminSubjectSelect" class="form-control" style="flex: 1; min-width: 180px;" onchange="loadQuestionsList()">
                    <!-- Populated dynamically -->
                </select>
                <input type="text" id="adminSearchInput" class="form-control" style="flex: 2; min-width: 200px;" placeholder="🔍 Filter questions..." onkeyup="filterAdminQuestions()" />
            </div>
        </div>

        <!-- Questions List Container -->
        <div id="adminQuestionsContainer" class="table-responsive">
            <!-- Populated via JS -->
        </div>
    </main>

    <!-- QUESTION MODAL DIALOG -->
    <div class="modal-backdrop" id="questionModal">
        <div class="modal-card animate-scale-up" style="max-width: 650px; width: 92%; max-height: 90vh; overflow-y: auto;">
            <button class="modal-close-btn" onclick="closeQuestionModal()">&times;</button>
            <h3 id="modalTitle" style="margin-bottom: 1.5rem;">Add New Question</h3>

            <form id="questionForm">
                <input type="hidden" id="qId" />

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Subject / Category</label>
                        <select id="qCategory" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Difficulty Level</label>
                        <select id="qDifficulty" class="form-control">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Question Type</label>
                    <select id="qType" class="form-control" onchange="toggleTypeFields(this.value)">
                        <option value="mcq">Multiple Choice (MCQ)</option>
                        <option value="true_false">True / False</option>
                        <option value="fill_blank">Fill in the Blank</option>
                        <option value="code">Code Snippet Question</option>
                        <option value="image">Image / Diagram Question</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Question Text</label>
                    <textarea id="qText" class="form-control" rows="3" placeholder="Enter question..." required></textarea>
                </div>

                <!-- Code Block Input (If Code Type) -->
                <div class="form-group" id="fieldCode" style="display: none;">
                    <label class="form-label">Code Snippet</label>
                    <textarea id="qCode" class="form-control" rows="3" placeholder="Paste code snippet here..."></textarea>
                </div>

                <!-- Image URL / SVG Input (If Image Type) -->
                <div class="form-group" id="fieldImage" style="display: none;">
                    <label class="form-label">Image URL or SVG Code</label>
                    <input type="text" id="qImage" class="form-control" placeholder="https://example.com/diagram.png or SVG data" />
                </div>

                <!-- MCQ Options (If MCQ Type) -->
                <div id="fieldOptions">
                    <label class="form-label">Answer Options</label>
                    <div class="form-group"><input type="text" id="opt0" class="form-control" placeholder="Option 1" /></div>
                    <div class="form-group"><input type="text" id="opt1" class="form-control" placeholder="Option 2" /></div>
                    <div class="form-group"><input type="text" id="opt2" class="form-control" placeholder="Option 3" /></div>
                    <div class="form-group"><input type="text" id="opt3" class="form-control" placeholder="Option 4" /></div>
                    
                    <div class="form-group">
                        <label class="form-label">Correct Option Index (0 = Opt 1, 1 = Opt 2, 2 = Opt 3, 3 = Opt 4)</label>
                        <select id="qAnswerIdx" class="form-control">
                            <option value="0">Option 1</option>
                            <option value="1">Option 2</option>
                            <option value="2">Option 3</option>
                            <option value="3">Option 4</option>
                        </select>
                    </div>
                </div>

                <!-- Fill Blank Correct Answer Input -->
                <div class="form-group" id="fieldFillBlank" style="display: none;">
                    <label class="form-label">Expected Text Answer</label>
                    <input type="text" id="qFillAnswer" class="form-control" placeholder="e.g. print" />
                </div>

                <div class="form-group">
                    <label class="form-label">Explanation</label>
                    <textarea id="qExplanation" class="form-control" rows="2" placeholder="Explanation for correct answer..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
                    <button type="button" class="btn btn-secondary btn-block" style="flex: 1;" onclick="closeQuestionModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-block" style="flex: 1;">Save Question</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/admin-questions.js"></script>
</body>

</html>
